# CRM stack — Docker Compose (dev local + Coolify)
#
# Local — todo en Docker:
#   docker compose up -d --build
#   Web: http://localhost:4000
#   API: http://localhost:4001/api
#
# Local — API/Web con pnpm (Redis + RabbitMQ en Docker):
#   pnpm dev:infra
#   pnpm dev
#
# Coolify (Service Stack → Docker Compose):
#   - No definir `networks:` custom; Coolify crea la red y conecta Traefik.
#   - Asigna dominios en la UI para `web` y `api` (o solo web si usas rewrites de Next).
#   - Labels Traefik indican el puerto interno del contenedor (3000 / 3001).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    expose:
      - '6379'
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    expose:
      - '5672'
      - '15672'
    ports:
      - '127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      BASE_URL: ${BASE_URL:-http://localhost:4001}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:4000}
      NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-}
    expose:
      - '3001'
    ports:
      - '${API_HOST_PORT:-4001}:3001'
    labels:
      - traefik.enable=true
      - traefik.http.services.crm-api.loadbalancer.server.port=3001
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4001}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
    expose:
      - '3000'
    ports:
      - '${WEB_HOST_PORT:-4000}:3000'
    labels:
      - traefik.enable=true
      - traefik.http.services.crm-web.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_started

volumes:
  redis_data:
  rabbitmq_data:
