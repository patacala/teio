# Redis configuration for CRM development

# Bind to all interfaces in Docker
bind 0.0.0.0

# No password in development (set REDIS_PASSWORD in prod)
# requirepass yourpassword

# Max memory (adjust for production)
maxmemory 256mb
maxmemory-policy noeviction

# Persistence
appendonly yes
appendfsync everysec

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable dangerous commands in production
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""

# Logging
loglevel notice

# TCP keepalive
tcp-keepalive 300
